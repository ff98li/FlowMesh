name: Feature request
description: Propose a new feature or enhancement.
title: "[Feature]: "
labels: ["feature request"]

body:
  - type: markdown
    attributes:
      value: >
        Before submitting, please search
        [existing issues](https://github.com/mlsys-io/FlowMesh/issues?q=is%3Aissue+sort%3Acreated-desc+)
        to avoid duplicates.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this feature relate to?
      options:
        - Server (orchestrator + worker manager)
        - Worker / Executor
        - SDK
        - CLI
        - Shared schemas / Proto
        - Docker / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Motivation
      description: >
        What problem does this solve? Is it related to a specific workflow or
        use case? e.g., "When running multi-stage DAGs, I need X because..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: >
        A clear description of what you'd like to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: >
        Any alternative solutions or workarounds you've considered.

  - type: textarea
    attributes:
      label: Additional context
      description: >
        Any other context, mockups, or examples.

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
