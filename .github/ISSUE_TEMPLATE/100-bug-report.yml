name: Bug report
description: Report a bug in FlowMesh.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: >
        Before submitting, please search
        [existing issues](https://github.com/mlsys-io/FlowMesh/issues?q=is%3Aissue+sort%3Acreated-desc+)
        to avoid duplicates.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Server (orchestrator + worker manager)
        - Worker / Executor
        - SDK
        - CLI
        - Shared schemas / Proto
        - Docker / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the bug
      description: |
        A clear description of the bug. Include:
        - What you expected to happen
        - What actually happened
        - Steps to reproduce (workflow YAML, SDK snippet, CLI command, etc.)
        - Full error message / traceback if applicable

        Wrap logs and code in triple-backtick blocks.
      placeholder: |
        Steps to reproduce:
        1. ...
        2. ...

        ```python
        # Code to reproduce
        ```

        ```
        Error traceback
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: |
        Please provide your environment details:
        - FlowMesh version / commit
        - Python version
        - OS
        - GPU (if relevant)
        - Docker version (if using containers)
      value: |
        - FlowMesh version:
        - Python version:
        - OS:
        - GPU:
        - Docker version:
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: >
        Any other context, screenshots, or log files.

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
