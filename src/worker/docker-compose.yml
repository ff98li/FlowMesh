services:
  redis_control:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports: ["6379:6379"]
    restart: unless-stopped

  redis_telemetry:
    image: redis:7-alpine
    command: ["redis-server", "--save", "300", "1", "--loglevel", "warning"]
    ports: ["6380:6379"]
    restart: unless-stopped

  flowmesh_server:
    build:
      context: ..
      dockerfile: src/server/Dockerfile
    image: flowmesh_server:latest
    depends_on:
      - redis_control
      - redis_telemetry
    environment:
      REDIS_CONTROL_URL: "redis://redis_control:6379/0"
      REDIS_TELEMETRY_URL: "redis://redis_telemetry:6379/0"
      LOG_LEVEL: INFO
      LOG_STREAM_MAXLEN_TASK: "50000"
      LOG_STREAM_MAXLEN_WORKFLOW: "200000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  flowmesh_worker:
    build:
      context: .
      dockerfile: src/worker/docker/Dockerfile.cuda
    image: flowmesh_worker:cuda-latest
    depends_on:
      - flowmesh_server
    environment:
      TZ: Asia/Singapore
      LOG_LEVEL: INFO
      HEARTBEAT_INTERVAL_SEC: "30"
      SUPERVISOR_GRPC_TARGET: "flowmesh_server:50051"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      SERVER_GRPC_TLS_CA_B64: "${SERVER_GRPC_TLS_CA_B64:-}"
      RESULTS_DIR: "/mnt/flowmesh-results"
      WORKER_COST_PER_HOUR: "1.0"
    volumes:
      - flowmesh_results:/mnt/flowmesh-results
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  flowmesh_results:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER:-localhost},rw,nfsvers=${NFS_VERSION:-4},tcp"
      device: ":${NFS_EXPORT_PATH:-/srv/flowmesh/results}"
